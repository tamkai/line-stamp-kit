<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絵柄の比較</title>
<style>
  :root { --paper:#F7F5F0; --card:#fff; --line:#E2DED6; --ink:#24211C; --soft:#625C52; --faint:#948D80; --ok:#2F7D4F; --ng:#B4432C; --accent:#2D6BD4; --accent-tint:#E8F0FC;
    --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Yu Gothic UI",Meiryo,system-ui,sans-serif; }
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;padding-bottom:130px}
  header{padding:28px 32px 6px} h1{font-size:22px;margin:0 0 4px} .meta{color:var(--soft);font-size:13px}
  .hint{margin:8px 32px 0;color:var(--soft);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px 32px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .card.selected{outline:3px solid var(--accent);outline-offset:-1px}
  .thumb{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background-color:#EEE;
    background-image:linear-gradient(45deg,#D8D8D8 25%,transparent 25%),linear-gradient(-45deg,#D8D8D8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#D8D8D8 75%),linear-gradient(-45deg,transparent 75%,#D8D8D8 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .thumb img{max-width:88%;max-height:88%;object-fit:contain}
  .badge{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff}
  .badge.ok{background:var(--ok)} .badge.ng{background:var(--ng)}
  .body{padding:10px 12px 12px} .name{font-weight:700;font-family:ui-monospace,Menlo,monospace;font-size:15px} .desc{color:var(--soft);font-size:13px} .spec{color:var(--faint);font-size:12px}
  .problems{margin:4px 0 0;padding:0 0 0 1.1em;color:var(--ng);font-size:13px}
  .pick{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px}
  .toolbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 32px;display:flex;gap:14px;align-items:center;box-shadow:0 -8px 24px -18px rgba(0,0,0,.35)}
  .toolbar textarea{flex:1;min-height:48px;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
  button{font:inherit;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600} button:disabled{opacity:.5;cursor:default}
  .copied{color:var(--ok);font-size:12px;min-width:12em}
</style>
</head>
<body>
<header><h1 id="title">絵柄の比較</h1><div class="meta" id="meta"></div></header>
<div class="hint">同じ表情・同じ文字を、絵柄だけ変えて作ったものです。気に入ったものをクリックして、右下の文をコピーして伝えてください。選んだ 1 枚がそのまま「お手本」になります。</div>
<div class="grid" id="grid"></div>
<div class="toolbar">
  <textarea id="out" readonly placeholder="絵柄をクリックすると、ここに伝える文ができます。"></textarea>
  <button class="primary" id="copy" disabled>この文をコピー</button>
  <span class="copied" id="copied"></span>
</div>
<script>
const DATA = /*__SAMPLES_DATA__*/null;
const DESC = { "atsunuri":"厚塗り・ポップ・彩度高め・太い白フチ", "flat-vector":"フラットなベクター調・くっきり・色数少なめ",
  "line-watercolor":"線画×水彩・やさしい色", "yuru-tegaki":"ゆるい手描きマーカー・脱力系", "clay":"マットなクレイ風 3D" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let picked = null;
function render() {
  if (!DATA) { $("#grid").textContent = "データがありません。check_stamps.py --samples から生成してください。"; return; }
  $("#title").textContent = (DATA.title ? DATA.title + " — " : "") + "絵柄の比較";
  $("#meta").textContent = `${String(DATA.no).padStart(2,"0")} ${DATA.text ? "「"+DATA.text+"」" : "（文字なし）"} / ${DATA.expression}　検査: ${DATA.generated_at.replace("T"," ").slice(0,16)}`;
  const g = $("#grid"); g.innerHTML = "";
  for (const it of DATA.items) {
    const c = document.createElement("div"); c.className = "card"; c.dataset.style = it.style;
    const spec = `${it.width}×${it.height} ${it.mode} ${it.kb}KB` + (it.transparent_ratio != null ? ` 透過${Math.round(it.transparent_ratio*100)}%` : "");
    c.innerHTML = `<div class="thumb"><img src="${it.file}?t=${it.mtime||0}" alt=""><span class="badge ${it.ok?"ok":"ng"}">${it.ok?"OK":"NG"}</span></div>
      <div class="body"><div class="name">${esc(it.style)}</div><div class="desc">${esc(DESC[it.style] || "")}</div><div class="spec">${spec}</div>
      ${it.problems.length ? `<ul class="problems">${it.problems.map((p)=>`<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      <label class="pick"><input type="radio" name="pick" value="${esc(it.style)}"> この絵柄にする</label></div>`;
    c.addEventListener("click", (e) => { picked = it.style; c.querySelector("input").checked = true; update(); });
    g.appendChild(c);
  }
}
function update() {
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("selected", c.dataset.style === picked));
  $("#out").value = picked ? `絵柄は ${picked} にしてください。` : ""; $("#copy").disabled = !picked;
}
$("#copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#out").value); } catch { $("#out").select(); document.execCommand("copy"); }
  $("#copied").textContent = "コピーしました。"; setTimeout(() => ($("#copied").textContent = ""), 3000);
});
render();
</script>
</body>
</html>
